name: learnharness

services:
  learnharness:
    image: learnharness:latest
    build: .
    ports:
      # Published on all interfaces so other devices can reach the app.
      # It has no auth, so keep this behind a host firewall.
      - "0.0.0.0:3000:3000"
    volumes:
      - lh-data:/data
    environment:
      LH_DATA_DIR: /data
      LH_AUTH_FILE: /data/auth.json
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped

volumes:
  lh-data:
